<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent-ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="28" fill="url(#bg-grad)" stroke="#27272a" stroke-width="2" />

  <!-- Grid / Tech background elements -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="240" />
    <line x1="480" y1="0" x2="480" y2="240" />
    <line x1="0" y1="120" x2="800" y2="120" />
  </g>

  <!-- LOGO ICON GROUP (Centered at X: 110, Y: 120) -->
  <g transform="translate(110, 120)">
    <!-- Outer Shield / Squircle Frame -->
    <rect x="-65" y="-65" width="130" height="130" rx="34" fill="#121215" stroke="#27272a" stroke-width="2" />
    
    <!-- Outer Aperture Accent Ring -->
    <circle cx="0" cy="0" r="46" stroke="url(#accent-ring)" stroke-width="2.5" stroke-dasharray="8 5" opacity="0.85" />
    
    <!-- Camera Body / Lens Frame -->
    <circle cx="0" cy="0" r="36" fill="#09090b" stroke="#3f3f46" stroke-width="2" />
    
    <!-- Lens Elements -->
    <circle cx="0" cy="0" r="26" fill="url(#lens-grad)" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.8" />
    <circle cx="-5" cy="-5" r="4" fill="#ffffff" fill-opacity="0.9" />

    <!-- Live indicator LED -->
    <circle cx="36" cy="-36" r="5" fill="#ef4444" filter="url(#glow)" />
    <circle cx="36" cy="-36" r="3" fill="#ffffff" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Starts at X: 210) -->
  <!-- Main Title: PS CAM -->
  <text x="210" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="54" fill="#ffffff" letter-spacing="-0.03em">
    PS<tspan fill="#38bdf8">.</tspan>CAM
  </text>

  <!-- Tagline Badge -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="10" cy="12" r="3" fill="#10b981" />
    <text x="19" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="10" fill="#94a3b8" letter-spacing="0.08em">LIVE P2P</text>
  </g>

  <!-- Subtitle -->
  <text x="212" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#a1a1aa" letter-spacing="0.02em">
    Transforme seu smartphone em câmera de segurança inteligente
  </text>

  <!-- Specs / Tech Pills -->
  <g transform="translate(212, 175)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="112" height="22" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="10" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500" font-size="11" fill="#71717a">WebRTC Direct</text>

    <!-- Pill 2 -->
    <rect x="122" y="0" width="116" height="22" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="132" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500" font-size="11" fill="#71717a">Motion Sensor</text>

    <!-- Pill 3 -->
    <rect x="248" y="0" width="110" height="22" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="258" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500" font-size="11" fill="#71717a">Cloud &amp; P2P</text>
  </g>
</svg>
