<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="icon-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="icon-ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="256" height="256" rx="60" fill="url(#icon-bg)" stroke="#27272a" stroke-width="3" />

  <!-- Outer Aperture Accent Ring -->
  <circle cx="128" cy="128" r="76" stroke="url(#icon-ring)" stroke-width="3.5" stroke-dasharray="14 8" opacity="0.9" />

  <!-- Camera Body / Lens Frame -->
  <circle cx="128" cy="128" r="60" fill="#09090b" stroke="#3f3f46" stroke-width="3" />

  <!-- Inner Lens Optics -->
  <circle cx="128" cy="128" r="44" fill="url(#icon-lens)" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="128" cy="128" r="24" fill="#38bdf8" fill-opacity="0.85" />
  <circle cx="120" cy="120" r="7" fill="#ffffff" fill-opacity="0.95" />

  <!-- Live recording status indicator LED -->
  <circle cx="188" cy="68" r="9" fill="#ef4444" filter="url(#icon-glow)" />
  <circle cx="188" cy="68" r="5" fill="#ffffff" />
</svg>
